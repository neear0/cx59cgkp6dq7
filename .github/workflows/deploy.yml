name: Deploy preview to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A static export cannot ship a proxy (middleware); the locale redirect
      # is done client-side by the generated index.html instead.
      - name: Drop the proxy for the static build
        run: rm -f proxy.ts

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Add root redirect
        run: |
          sed "s|__BASE_PATH__|/${{ github.event.repository.name }}|g" \
            .github/pages/index.html > out/index.html
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
